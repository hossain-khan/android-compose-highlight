name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

# Skip the heavy Android build when only docs and non-Android files change.
# A single always-running "Build & Test" job satisfies the required branch protection check
# in all cases - it exits early with a success message for non-code changes.
jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check for code and docs changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }}...${{ github.sha }} 2>/dev/null || git diff --name-only HEAD)
          fi
          echo "Changed files:"
          echo "$CHANGED"
          CODE_CHANGED=false
          DOCS_CHANGED=false
          while IFS= read -r file; do
            if [[ "$file" == compose-highlight/src/* || \
                  "$file" == sample/src/* || \
                  "$file" == buildSrc/* || \
                  "$file" == gradle/* || \
                  "$file" == "gradlew" || \
                  "$file" == "gradlew.bat" || \
                  "$file" == "gradle.properties" || \
                  "$file" == "settings.gradle" || \
                  "$file" == "settings.gradle.kts" || \
                  "$file" == "build.gradle" || \
                  "$file" == "build.gradle.kts" || \
                  "$file" == "compose-highlight/build.gradle.kts" || \
                  "$file" == "sample/build.gradle.kts" || \
                  "$file" == "gradle/libs.versions.toml" || \
                  "$file" == "libs.versions.toml" || \
                  "$file" == scripts/* || \
                  "$file" == *.gradle || \
                  "$file" == *.gradle.kts || \
                  "$file" == .github/workflows/* ]]; then
              CODE_CHANGED=true
            fi

            if [[ "$file" == docs/* || \
                  "$file" == zensical.toml || \
                  "$file" == pyproject.toml || \
                  "$file" == compose-highlight/dokka-theme/* || \
                  "$file" == ".github/workflows/docs.yml" ]]; then
              DOCS_CHANGED=true
            fi
          done <<< "$CHANGED"
          echo "code=$CODE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "docs=$DOCS_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Code changed: $CODE_CHANGED"
          echo "Docs changed: $DOCS_CHANGED"

      - name: No code/docs changes - skipping build
        if: steps.changes.outputs.code == 'false' && steps.changes.outputs.docs == 'false'
        run: echo "No Android or docs-related files changed. Skipping heavy checks."

      - name: Set up Python
        if: steps.changes.outputs.docs == 'true'
        uses: actions/setup-python@v6.3.0
        with:
          python-version: 3.x

      - name: Install docs dependencies
        if: steps.changes.outputs.docs == 'true'
        run: pip install .

      - name: Validate docs build
        if: steps.changes.outputs.docs == 'true'
        run: zensical build --clean

      - name: No Android code changes - skipping Android build
        if: steps.changes.outputs.code == 'false'
        run: echo "No Android-impacting files changed. Skipping Android build and tests."

      - name: Set up JDK 17
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-java@v5.5.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changes.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Enable KVM (required for hardware-accelerated emulation)
        if: steps.changes.outputs.code == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache ATD system image
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd
            ${{ env.ANDROID_HOME }}/system-images
            ${{ env.ANDROID_HOME }}/emulator
          key: managed-device-pixel2api30-aosp-atd-${{ runner.os }}

      - name: Check Kotlin formatting
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew lintKotlin

      - name: Generate Dokka API docs
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :compose-highlight:dokkaGeneratePublicationHtml

      - name: Run Android Lint
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :compose-highlight:lint

      - name: Run unit tests
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :compose-highlight:testDebugUnitTest

      - name: Verify Roborazzi screenshots
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :compose-highlight:verifyRoborazziDebug

      - name: Upload Roborazzi diff images on failure
        if: failure() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: roborazzi-diff-images
          path: |
            compose-highlight/build/outputs/roborazzi/
            compose-highlight/build/reports/roborazzi/
          if-no-files-found: ignore

      - name: Accept Android SDK licenses
        if: steps.changes.outputs.code == 'true'
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Run instrumented tests on Gradle Managed Device (ATD)
        if: steps.changes.outputs.code == 'true'
        run: |
          ./gradlew :compose-highlight:pixel2api30DebugAndroidTest \
            -P android.testInstrumentationRunnerArguments.notPackage=dev.hossain.highlight.benchmark

      - name: Generate combined coverage report
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :compose-highlight:jacocoTestReport

      - name: Upload coverage reports to Codecov
        if: steps.changes.outputs.code == 'true'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hossain-khan/android-compose-highlight
          files: ./compose-highlight/build/reports/jacoco/jacocoTestReport.xml
          fail_ci_if_error: false

      - name: Assemble library (debug)
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :compose-highlight:assembleDebug

      - name: Assemble sample app (debug)
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :sample:assembleDebug

      - name: Assemble library (release) and generate Compose compiler reports
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :compose-highlight:assembleRelease -PcomposeReports=true

      - name: Assemble sample app (release)
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :sample:assembleRelease

      - name: Smoke test Maven publication
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :compose-highlight:publishToMavenLocal

      - name: Upload Compose compiler reports
        if: steps.changes.outputs.code == 'true' || failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: compose-compiler-reports
          path: compose-highlight/build/compose_compiler/

      - name: Verify Compose compiler skippability
        if: steps.changes.outputs.code == 'true'
        run: ./scripts/verify-compose-compiler-reports.sh

      - name: Upload test results
        if: steps.changes.outputs.code == 'true' || failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: |
            compose-highlight/build/test-results/
            compose-highlight/build/reports/androidTests/
