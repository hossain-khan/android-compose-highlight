name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check Kotlin formatting
        run: ./gradlew lintKotlin

      - name: Run unit tests and generate coverage report
        run: ./gradlew :compose-highlight:test :compose-highlight:jacocoTestReport

      - name: Debug - Check coverage files
        if: always()
        run: |
          echo "=== Checking exec file ==="
          if [ -f compose-highlight/build/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec ]; then
            EXEC_SIZE=$(wc -c < compose-highlight/build/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec)
            echo "Exec file exists, size: $EXEC_SIZE bytes"
            if [ "$EXEC_SIZE" -lt 100 ]; then
              echo "WARNING: Exec file is suspiciously small!"
            fi
          else
            echo "Exec file NOT found"
          fi
          echo ""
          echo "=== All intermediates directories with .class files ==="
          if [ -d compose-highlight/build/intermediates ]; then
            echo "Searching for .class files in intermediates..."
            find compose-highlight/build/intermediates -name "*.class" -type f | head -5 | xargs -I {} dirname {} | sort | uniq
            echo ""
            echo "Total .class files found:"
            find compose-highlight/build/intermediates -name "*.class" -type f | wc -l
            echo ""
            echo "Top-level intermediates directories:"
            ls -la compose-highlight/build/intermediates/ | grep "^d"
          else
            echo "Intermediates directory NOT found"
          fi
          echo ""
          echo "=== Checking XML report ==="
          if [ -f compose-highlight/build/reports/jacoco/jacocoTestReport.xml ]; then
            XML_SIZE=$(wc -c < compose-highlight/build/reports/jacoco/jacocoTestReport.xml)
            echo "XML file exists, size: $XML_SIZE bytes"
            if grep -q "<package" compose-highlight/build/reports/jacoco/jacocoTestReport.xml; then
              echo "✓ XML contains package data"
            else
              echo "✗ XML is EMPTY (no package data)"
            fi
            echo "First 30 lines:"
            head -30 compose-highlight/build/reports/jacoco/jacocoTestReport.xml
          else
            echo "XML file NOT found"
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: hossain-khan/android-compose-highlight
          files: ./compose-highlight/build/reports/jacoco/jacocoTestReport.xml
          fail_ci_if_error: false

      - name: Assemble library (debug)
        run: ./gradlew :compose-highlight:assembleDebug

      - name: Assemble sample app (debug)
        run: ./gradlew :sample:assembleDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-test-results
          path: compose-highlight/build/test-results/
