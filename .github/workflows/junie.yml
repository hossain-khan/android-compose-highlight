# JetBrains Junie Interactive Agent Workflow
# Source Action: https://github.com/JetBrains/junie-github-action
# Documentation: resources/JUNIE_AUTOMATION.md
#
# Listens for '@junie-agent' mentions in issues, PR comments, and PR reviews.
# Authenticated via OpenRouter BYOK (requires secrets.OPENROUTER_API_KEY).
# Model configured via secrets.OPENROUTER_MODEL_NAME (must be without provider prefix, e.g. 'claude-sonnet-5-5').

name: Junie Interactive Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  junie:
    name: Run Junie Agent
    # Security: Restrict runs to trusted users (OWNER, MEMBER, COLLABORATOR) to prevent
    # unauthorized external commenters from consuming Actions runners or OpenRouter API quota.
    # Ref: https://docs.github.com/en/webhooks/webhook-events-and-payloads#issue_comment
    # See also: resources/JUNIE_AUTOMATION.md
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@junie-agent')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@junie-agent')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@junie-agent')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@junie-agent') || contains(github.event.issue.title, '@junie-agent')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Junie
        uses: JetBrains/junie-github-action@v1
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ secrets.OPENROUTER_MODEL_NAME || vars.OPENROUTER_MODEL_NAME || 'claude-sonnet-5-5' }}
          use_single_comment: "true"
