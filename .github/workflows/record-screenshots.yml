name: Record Roborazzi screenshots

# Manual workflow that re-records the Roborazzi golden screenshots on Linux
# (the canonical CI environment) and opens a PR with the updated images.
#
# When to use this:
# - You made an intentional visual change (theme tweak, layout adjustment, etc.) and
#   need to refresh the goldens.
# - You recorded goldens locally on a non-Linux machine and CI is failing because of
#   OS rendering drift.
#
# How to use this:
# - Open https://github.com/hossain-khan/android-compose-highlight/actions
# - Pick the "Record Roborazzi screenshots" workflow
# - Click "Run workflow", choose the branch you want to record against, click "Run"
# - Wait for the run to finish; review the auto-opened PR with the regenerated PNGs.
#
# See compose-highlight/SCREENSHOT_TESTS.md for the full screenshot-testing guide.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to record against (defaults to current)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    name: Record screenshots on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Record Roborazzi screenshots
        run: ./gradlew :compose-highlight:recordRoborazziDebug

      - name: Show diff
        run: |
          git status compose-highlight/src/test/snapshots/images/
          git diff --stat compose-highlight/src/test/snapshots/images/ || true

      - name: Open PR with regenerated goldens
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "test(screenshots): refresh Roborazzi goldens on Linux"
          title: "test(screenshots): refresh Roborazzi goldens on Linux"
          body: |
            Auto-generated by the [Record Roborazzi screenshots](.github/workflows/record-screenshots.yml) workflow.

            Goldens were re-recorded on `ubuntu-latest`, the canonical Linux baseline that CI verifies against. Review the PNG diffs to confirm the visual changes match expectations before merging.

            See `compose-highlight/SCREENSHOT_TESTS.md` for the screenshot-testing guide.
          branch: chore/refresh-screenshot-goldens
          delete-branch: true
          add-paths: compose-highlight/src/test/snapshots/images/
