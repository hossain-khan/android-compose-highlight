name: Android Release Build

# Workflow that builds a signed release APK for the sample app.
# Triggers:
#   1. When a GitHub release is published - automatically attaches APK to the release.
#   2. Manually via workflow_dispatch - useful for verifying the workflow works correctly.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to upload assets to GitHub releases

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build release APK
        run: ./gradlew :sample:assembleRelease

      - name: Extract version name
        id: version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' sample/build.gradle.kts | cut -d'"' -f2)
          echo "VERSION=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Sample app version: $VERSION_NAME"

      - name: Rename APK
        run: |
          mkdir -p artifact
          cp sample/build/outputs/apk/release/sample-release.apk \
            artifact/highlight-v${{ steps.version.outputs.VERSION }}.apk
          echo "APK renamed to: highlight-v${{ steps.version.outputs.VERSION }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: highlight-apk
          path: artifact/highlight-v${{ steps.version.outputs.VERSION }}.apk
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="artifact/highlight-v${{ steps.version.outputs.VERSION }}.apk"

          gh release upload "${{ github.ref_name }}" "$APK_FILE" --clobber
          echo "Successfully attached $(basename "$APK_FILE") to release ${{ github.ref_name }}"
