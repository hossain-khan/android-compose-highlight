[versions]
agp = "9.2.1"
androidxActivity = "1.13.0"
androidxBenchmark = "1.4.1"
androidxComposeBom = "2026.05.01"
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxTest = "1.7.0"
androidxTestEspresso = "3.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxWebkit = "1.16.0"
coroutines = "1.11.0"
dokka = "2.2.0"
junit = "4.13.2"
json = "20260522"
